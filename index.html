<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='8' fill='%231c6250'/><text x='10' y='29' font-family='Georgia' font-size='31' fill='white'>a</text><circle cx='31' cy='28' r='2' fill='%23dcebe2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auverie · Ceritamu, layar demi layar</title>
    <meta name="description" content="Buat cerita AU melalui layar aplikasi, percakapan, postingan, dan kolase. Langsung menulis tanpa akun." />
    <meta name="theme-color" content="#f6f3eb" />
    <link rel="preload" href="/fonts/plusjakartasans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html { background: #f6f3eb; color: #23312c; }
      html[data-studio-theme="dark"] { background: #151d1a; color: #eef5ef; }
      body { margin: 0; }
      .boot-loading { min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; }
      .boot-loading strong { font: 500 40px Georgia, serif; }
      .boot-loading button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 7px; background: #176c59; color: white; font: inherit; cursor: pointer; }
    </style>
    <script>
      var appLoadFailed = false;
      window.addEventListener('error', event => {
        if (event.target?.tagName === 'SCRIPT' || event instanceof ErrorEvent) {
          appLoadFailed = true;
          if (typeof showLoadError === 'function' && document.getElementById('boot-loading')) showLoadError();
        }
      }, true);
      try {
        document.documentElement.dataset.studioTheme = localStorage.getItem('au_studio_theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.lang = localStorage.getItem('auverie_language') === 'en' ? 'en' : 'id';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><div id="boot-loading" class="boot-loading" role="status"><strong>auverie.</strong><span id="boot-caption">Menyiapkan ruang ceritamu…</span><button id="boot-retry" hidden onclick="location.reload()">Muat ulang</button></div></div>
    <noscript>Aktifkan JavaScript untuk membuat dan membuka cerita di Auverie. Enable JavaScript to use Auverie.</noscript>
    <script>
      if (document.documentElement.lang === 'en') {
        document.getElementById('boot-caption').textContent = 'Preparing your story space…';
        document.getElementById('boot-retry').textContent = 'Reload';
      }
      function showLoadError() {
        document.getElementById('boot-caption').textContent = document.documentElement.lang === 'en' ? 'The app could not load. Reload to try again.' : 'Aplikasi belum bisa dimuat. Muat ulang untuk mencoba lagi.';
        document.getElementById('boot-retry').hidden = false;
        document.getElementById('boot-loading').setAttribute('role', 'alert');
      }
      if (appLoadFailed) showLoadError();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
